# Config for Pages CMS (https://pagescms.org) — the staff upload form.
media:
  input: public/uploads
  output: /uploads

content:
  - name: pets
    label: Pets
    type: collection
    path: src/content/pets
    format: json
    filename: "{primary}.json"
    view:
      primary: id
      fields: [id, artist]
      sort: [id]
    fields:
      - name: id
        label: Pet ID
        type: string
        required: true
        description: The pet's ID number. This becomes the page address (yoursite.com/ID).
      - name: artist
        label: Artist
        type: string
        required: true
      - name: image
        label: Pet image
        type: image
        required: true
        description: Upload the biggest version you have. PNG with a transparent background is best.
      - name: bio
        label: Information
        type: text
        required: false
        description: Optional. A short blurb shown under the pet image. Blank lines make new paragraphs. Supports simple BBCode -- [b]bold[/b], [i]italic[/i], [u]underline[/u], [s]strikethrough[/s], [url=link]text[/url].

  - name: items
    label: Items
    type: collection
    path: src/content/items
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, type]
      sort: [name]
    fields:
      - name: name
        label: Item Name
        type: string
        required: true
        description: e.g. "MYO Ticket", "Rare Candy". This becomes the item's page address, so try to avoid renaming it later once players have shared links to it.
      - name: type
        label: Item Type
        type: string
        required: true
        description: e.g. "Ticket", "Currency", "Collectible"
      - name: artist
        label: Artist
        type: string
        required: false
        description: Optional. Leave blank for things like tickets that don't have an artist.
      - name: image
        label: Item image
        type: image
        required: true
        description: Upload the biggest version you have. PNG with a transparent background is best.
      - name: bio
        label: Information
        type: text
        required: false
        description: Optional. Shown next to the item image. Supports simple BBCode -- [b]bold[/b], [i]italic[/i], [u]underline[/u], [s]strikethrough[/s], [url=link]text[/url].

  - name: artists
    label: Artists
    type: collection
    path: src/content/artists
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, socialLabel]
      sort: [name]
    fields:
      - name: name
        label: Artist Username
        type: string
        required: true
      - name: socialUrl
        label: Social Media Link
        type: string
        required: false
        description: Optional. Paste the full web address, e.g. https://instagram.com/username
      - name: socialLabel
        label: Social Media Site Name
        type: string
        required: false
        description: Optional. e.g. "Instagram", "Toyhouse", "DeviantArt". Shown on the button. Leave blank and the button just says "Visit Profile".
